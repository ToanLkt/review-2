<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1060" width="1140" height="1060" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
