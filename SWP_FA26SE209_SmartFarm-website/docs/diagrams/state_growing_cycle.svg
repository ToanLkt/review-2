<svg width="860" height="1040" viewBox="0 0 860 1040" xmlns="http://www.w3.org/2000/svg">
<defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .title { font-size: 18px; font-weight: 700; fill: #000000; text-anchor: middle; letter-spacing: -0.01em; }
        .subtitle { font-size: 11.5px; font-weight: 500; fill: #333333; text-anchor: middle; }
        .state-text { font-size: 12.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
        .state-sub { font-size: 9.5px; font-weight: 500; fill: #333333; text-anchor: middle; font-family: 'JetBrains Mono', monospace; }
        .edge-label { font-size: 10px; font-weight: 700; fill: #000000; text-anchor: middle; }
        .line { fill: none; stroke: #000000; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
        .line-dashed { fill: none; stroke: #000000; stroke-width: 1.3; stroke-dasharray: 5,4; stroke-linecap: round; stroke-linejoin: round; }
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
      </marker>
    </defs>
<rect width="860" height="1040" fill="#ffffff"/>

    <g transform="translate(0, 0)">
      <rect x="30" y="14" width="800" height="46" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text class="title" x="430" y="35">State Machine Diagram: Growing Cycle Lifecycle</text>
      <text class="subtitle" x="430" y="50">SUMFAS · Vòng đời trạng thái canh tác (CropStatus) của khay thuê từ gieo trồng đến thu hoạch</text>
    </g>
<circle cx="320" cy="80" r="8" fill="#000000"/>
<rect x="220" y="130" width="200" height="44" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="state-text" x="320.0" y="150.0">WAITING_PLANTING</text>
<text class="state-sub" x="320.0" y="165.0">Chờ đến ngày gieo trồng</text>
<rect x="220" y="220" width="200" height="44" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="state-text" x="320.0" y="240.0">PLANTED</text>
<text class="state-sub" x="320.0" y="255.0">Đã gieo hạt vào khay</text>
<rect x="220" y="310" width="200" height="44" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="state-text" x="320.0" y="330.0">GERMINATING</text>
<text class="state-sub" x="320.0" y="345.0">Hạt nảy mầm (Sprout)</text>
<rect x="220" y="400" width="200" height="44" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="state-text" x="320.0" y="420.0">GROWING</text>
<text class="state-sub" x="320.0" y="435.0">Cây con sinh trưởng</text>
<rect x="220" y="490" width="200" height="44" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="state-text" x="320.0" y="510.0">READY_TO_HARVEST</text>
<text class="state-sub" x="320.0" y="525.0">Đủ ngày thu hoạch</text>
<rect x="220" y="580" width="200" height="44" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="state-text" x="320.0" y="600.0">HARVESTED</text>
<text class="state-sub" x="320.0" y="615.0">SoilTray sang MAINTENANCE</text>
<polygon points="320,656 385,680 320,704 255,680" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="state-text" x="320" y="684" font-size="11px">Hết chu kỳ?</text>
<rect x="600" y="355" width="160" height="46" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="state-text" x="680.0" y="376.0">FAILED</text>
<text class="state-sub" x="680.0" y="391.0">Sự cố / Bỏ vụ (Override)</text>

    <g transform="translate(320, 780)">
      <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#000000"/>
    </g>
<line class="line" x1="320" y1="88" x2="320" y2="130" marker-end="url(#arrow)"/>
<rect x="328" y="96" width="75" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="365" y="107">Tạo đơn thuê</text>
<line class="line" x1="320" y1="174" x2="320" y2="220" marker-end="url(#arrow)"/>
<rect x="328" y="187" width="180" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="418" y="198">[StartDate &lt;= now &amp; CONFIRMED]</text>
<line class="line" x1="320" y1="264" x2="320" y2="310" marker-end="url(#arrow)"/>
<rect x="328" y="277" width="135" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="395" y="288">Staff gieo &amp; xác nhận</text>
<line class="line" x1="320" y1="354" x2="320" y2="400" marker-end="url(#arrow)"/>
<rect x="328" y="367" width="145" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="400" y="378">[Days &gt;= GerminationDays]</text>
<line class="line" x1="320" y1="444" x2="320" y2="490" marker-end="url(#arrow)"/>
<rect x="328" y="457" width="155" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="405" y="468">[Days &gt;= TargetHarvestDays]</text>
<line class="line" x1="320" y1="534" x2="320" y2="580" marker-end="url(#arrow)"/>
<rect x="328" y="547" width="135" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="395" y="558">Staff gọi HarvestAsync()</text>
<line class="line" x1="320" y1="624" x2="320" y2="656" marker-end="url(#arrow)"/>
<path class="line-dashed" d="M 255 680 H 80 V 242 H 220" marker-end="url(#arrow)"/>
<rect x="90" y="664" width="145" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="162" y="675">[DELIVERED &amp; Còn chu kỳ]</text>
<line class="line" x1="320" y1="704" x2="320" y2="766" marker-end="url(#arrow)"/>
<rect x="328" y="706" width="160" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="408" y="717">[Hết chu kỳ: Order COMPLETED]</text>
<path class="line" d="M 420 152 H 600" marker-end="url(#arrow)"/>
<path class="line" d="M 420 242 H 600" marker-end="url(#arrow)"/>
<path class="line" d="M 420 332 H 600" marker-end="url(#arrow)"/>
<path class="line" d="M 420 422 H 600" marker-end="url(#arrow)"/>
<path class="line" d="M 420 512 H 600" marker-end="url(#arrow)"/>
<rect x="490" y="315" width="90" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="edge-label" x="535" y="326">Staff override</text>
<path class="line" d="M 680 401 V 780 H 334" marker-end="url(#arrow)"/>
</svg>