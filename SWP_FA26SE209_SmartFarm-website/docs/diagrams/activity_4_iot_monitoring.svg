<text class="action-text" x="760.0" y="481.0">Get Thresholds</text>
<text class="action-sub" x="760.0" y="496.0">CropThresholds by Season</text>

        <polygon points="760,520.0 820.0,550 760,580.0 700.0,550" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <text class="action-text" x="760" y="554" font-size="12px">Check Value</text>
<rect x="510" y="630" width="130" height="46" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
