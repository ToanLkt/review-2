<svg width="1200" height="980" viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg">
<defs>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .title { font-size: 19px; font-weight: 700; fill: #000000; text-anchor: middle; letter-spacing: -0.01em; }
        .subtitle { font-size: 12px; font-weight: 500; fill: #333333; text-anchor: middle; }
        .lane-title { font-size: 13px; font-weight: 700; fill: #000000; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.06em; }
        .lane-sub { font-size: 10px; font-weight: 500; fill: #555555; text-anchor: middle; }
        .action-text { font-size: 12.5px; font-weight: 700; fill: #000000; text-anchor: middle; }
        .action-sub { font-size: 9.5px; font-weight: 500; fill: #333333; text-anchor: middle; font-family: 'JetBrains Mono', monospace; }
        .edge-label { font-size: 10px; font-weight: 700; fill: #000000; text-anchor: middle; }
        .line { fill: none; stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .line-loop { fill: none; stroke: #000000; stroke-width: 1.3; stroke-dasharray: 5,4; stroke-linecap: round; stroke-linejoin: round; }
      </style>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#000000"/>
      </marker>
    </defs>
<rect width="1200" height="980" fill="#ffffff"/>

    <g transform="translate(0, 0)">
      <rect x="30" y="16" width="1140" height="46" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
      <text class="title" x="600" y="37">Activity Diagram 4: IoT Monitoring &amp; Auto Control Loop</text>
      <text class="subtitle" x="600" y="52">Automated Loop: Sensor Telemetry, Threshold Analysis, Actuator Control &amp; FCM Alerting</text>
    </g>
<rect x="30" y="118" width="240" height="835" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
