<text class="action-sub" x="150.0" y="736.0">Toggle Pump, Fan, Light</text>
<rect x="60" y="770" width="180" height="46" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="action-text" x="150.0" y="791.0">Send ACK</text>
<text class="action-sub" x="150.0" y="806.0">Topic: .../command-acks</text>
<rect x="670" y="770" width="180" height="46" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="action-text" x="760.0" y="791.0">Update Result</text>
<text class="action-sub" x="760.0" y="806.0">Result = SUCCESS</text>
<rect x="950" y="527" width="180" height="46" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="action-text" x="1040.0" y="548.0">Create Alert</text>
<text class="action-sub" x="1040.0" y="563.0">SystemAlert (CRITICAL)</text>
<rect x="950" y="630" width="180" height="46" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="action-text" x="1040.0" y="651.0">Send FCM Notification</text>
<text class="action-sub" x="1040.0" y="666.0">Push to Staff &amp; Customer App</text>

