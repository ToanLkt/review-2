<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1120" width="1140" height="1120" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="20" width="1100" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="570.0" y="42" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle" letter-spacing="0.5">Activity Diagram 5: Delivery &amp; Fulfillment Management</text>
  <text x="570.0" y="57" font-size="11" fill="#444444" text-anchor="middle">Order Packaging, Shipper Dispatch, Proof of Delivery &amp; Fulfillment Lifecycle</text>

  <!-- Swimlane Headers -->
  <rect x="20" y="65" width="240" height="45" fill="#f8f8f8" stroke="#000000" stroke-width="1.5"/>
  <text x="140" y="86" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">PACKING STAFF</text>
  <text x="140" y="100" font-size="10" fill="#444444" text-anchor="middle">Warehouse &amp; Quality Check</text>

  <rect x="260" y="65" width="340" height="45" fill="#f8f8f8" stroke="#000000" stroke-width="1.5"/>
  <text x="430" y="86" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">SUMFAS BACKEND</text>
  <text x="430" y="100" font-size="10" fill="#444444" text-anchor="middle">DeliveryService &amp; Inventory Engine</text>

  <rect x="600" y="65" width="260" height="45" fill="#f8f8f8" stroke="#000000" stroke-width="1.5"/>
  <text x="730" y="86" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">SHIPPER</text>
  <text x="730" y="100" font-size="10" fill="#444444" text-anchor="middle">Logistics &amp; Transport Partner</text>

  <rect x="860" y="65" width="260" height="45" fill="#f8f8f8" stroke="#000000" stroke-width="1.5"/>
  <text x="990" y="86" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">CUSTOMER</text>
  <text x="990" y="100" font-size="10" fill="#444444" text-anchor="middle">Recipient &amp; Consumer</text>

  <!-- Swimlane Outer & Vertical Dividers -->
  <rect x="20" y="110" width="1100" height="990" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="260" y1="110" x2="260" y2="1100" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="600" y1="110" x2="600" y2="1100" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="860" y1="110" x2="860" y2="1100" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>

  <circle cx="140" cy="140" r="11" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <line x1="140" y1="151" x2="140" y2="180" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="45" y="180" width="190" height="48" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="140.0" y="200" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Inspect Harvested Sprouts</text>
  <text x="140.0" y="215" font-size="9.5" fill="#444444" text-anchor="middle">Quality &amp; Weight Verification</text>
  <path d="M 235 204 H 325" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="325" y="180" width="210" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430.0" y="200" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Create Delivery Record</text>
  <text x="430.0" y="215" font-size="9.5" fill="#444444" text-anchor="middle">Status = PENDING, Order = PREPARING</text>
  <path d="M 325 290 H 235" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="45" y="265" width="190" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="140.0" y="285" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Package Harvested Sprouts</text>
  <text x="140.0" y="300" font-size="9.5" fill="#444444" text-anchor="middle">Record ActualWeightKg</text>
  <path d="M 140 315 V 360 H 325" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="325" y="335" width="210" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430.0" y="355" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Update Status: PACKAGED</text>
  <text x="430.0" y="370" font-size="9.5" fill="#444444" text-anchor="middle">Assign Shipper (AssignAsync)</text>
  <path d="M 535 360 H 625" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="625" y="335" width="210" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="730.0" y="355" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Pick Up Package</text>
  <text x="730.0" y="370" font-size="9.5" fill="#444444" text-anchor="middle">Pickup Confirmation at Farm</text>
  <path d="M 730 385 V 425 H 545" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="315" y="400" width="230" height="52" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430.0" y="420" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Update Status: SHIPPING</text>
  <text x="430.0" y="435" font-size="9.5" fill="#444444" text-anchor="middle">Atomic Stock SALE &amp; DELIVERING</text>
  <path d="M 430 452 V 495 H 625" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="625" y="470" width="210" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="730.0" y="490" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Deliver to Customer</text>
  <text x="730.0" y="505" font-size="9.5" fill="#444444" text-anchor="middle">Transport to Destination</text>
  <line x1="730" y1="520" x2="730" y2="560" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="730,560.0 790.0,584 730,608.0 670.0,584" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="730" y="588" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">Delivery Success?</text>
  <path d="M 670 584 H 545" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="574" width="60" height="20" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="610" y="587" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">[Failed]</text>
  <rect x="315" y="560" width="230" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430.0" y="580" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Set Status: FAILED</text>
  <text x="430.0" y="595" font-size="9.5" fill="#444444" text-anchor="middle">Record FailureReason &amp; Alert</text>
  <line x1="430" y1="610" x2="430" y2="645" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="315" y="645" width="230" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430.0" y="665" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Staff Manual Resolution</text>
  <text x="430.0" y="680" font-size="9.5" fill="#444444" text-anchor="middle">Customer Contact / Reschedule</text>
  <line x1="430" y1="695" x2="430" y2="730" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="430" cy="742" r="12" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="430" cy="742" r="7" fill="#000000"/>
  <line x1="730" y1="608" x2="730" y2="655" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="738" y="620" width="68" height="20" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="772" y="633" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">[Delivered]</text>
  <rect x="625" y="655" width="210" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="730.0" y="675" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Capture Delivery Proof</text>
  <text x="730.0" y="690" font-size="9.5" fill="#444444" text-anchor="middle">Photo Proof &amp; Signature</text>
  <path d="M 835 680 H 885" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="885" y="655" width="210" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="990.0" y="675" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Receive &amp; Inspect Package</text>
  <text x="990.0" y="690" font-size="9.5" fill="#444444" text-anchor="middle">Verify Fresh Sprouts Quality</text>
  <path d="M 990 705 V 805 H 545" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="315" y="780" width="230" height="52" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430.0" y="800" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Update Status: DELIVERED</text>
  <text x="430.0" y="815" font-size="9.5" fill="#444444" text-anchor="middle">DeliveredAt = UtcNow &amp; Push FCM</text>
  <line x1="430" y1="832" x2="430" y2="872" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="430,872.0 490.0,896 430,920.0 370.0,896" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430" y="900" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">All Cycles Done?</text>
  <path d="M 370 896 H 235" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="886" width="55" height="20" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="297" y="899" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">[No]</text>
  <rect x="45" y="871" width="190" height="50" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="140.0" y="891" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Ready for Next Cycle</text>
  <text x="140.0" y="906" font-size="9.5" fill="#444444" text-anchor="middle">Order Remains CONFIRMED</text>
  <line x1="140" y1="921" x2="140" y2="965" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="140" cy="977" r="12" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="140" cy="977" r="7" fill="#000000"/>
  <line x1="430" y1="920" x2="430" y2="965" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="438" y="930" width="55" height="20" rx="4" ry="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="465" y="943" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">[Yes]</text>
  <rect x="315" y="965" width="230" height="52" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="430.0" y="985" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Set Order: COMPLETED</text>
  <text x="430.0" y="1000" font-size="9.5" fill="#444444" text-anchor="middle">Fulfillment Done &amp; Clear Trays</text>
  <path d="M 545 991 H 885" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="885" y="965" width="210" height="52" rx="8" ry="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="990.0" y="985" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Rate &amp; Review Service</text>
  <text x="990.0" y="1000" font-size="9.5" fill="#444444" text-anchor="middle">Customer Feedback &amp; Quality</text>
  <line x1="990" y1="1017" x2="990" y2="1055" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="990" cy="1067" r="12" fill="none" stroke="#000000" stroke-width="1.5"/>
  <circle cx="990" cy="1067" r="7" fill="#000000"/>
</svg>